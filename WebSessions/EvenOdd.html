<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Even Odd</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <style>
        p, label, h2, h1{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Even Odd Numbers</h1>    
    <hr />
    <form  name="frmNos">
        <p>
            <label>Enter any number </label><br />
            <input type="text"  name="txtVal" />
            <input type="button"  value="Click Me" onclick="TestEvenOdd()" />
        </p>
    </form>
    <p>
        <label>All Numbers</label>
        <h2  id="res_nos"></h2>
        </p>
        <p>
        <label>Even Numbers</label>
        <h2   id="res_even"></h2>
    </p>
    <p>
        <label>Odd Numbers</label>
        <h2   id="res_odd"></h2>
    </p>

    <script type="text/javascript">
        // global varaibles

        var numbers = [];
        var evenNos = [];
        var oddNos = [];

        function TestEvenOdd()
        {
            let n = parseInt(frmNos.txtVal.value);
            numbers.push(n);
            if(n%2==0)
                evenNos.push(n);
            else
                oddNos.push(n);

            document.getElementById("res_nos").innerHTML = numbers;
            document.getElementById("res_even").innerHTML = evenNos;
            document.getElementById("res_odd").innerHTML = oddNos;
        }

    </script>
</body>
</html>
