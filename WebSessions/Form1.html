<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>

    <h2 style="text-align: center;">HTML Forms </h2>
    <hr />
    <p style="text-align: center;width: 100%;">
        <label>Username</label><br />
        <input type="text"  name="txtName" placeholder="Username" />
        <br /><label>Password</label><br />
        <input type="password"  name="txtPwd"  placeholder="Password" />
            <br /> <br />
        <input type="button"  value="Click Me" />
    </p>
    <hr />
    <p style="text-align: center;width: 100%;">
        <label>Person Name</label><br />
        <input type="text"  name="txtName" placeholder="Person Name" />
        <br />
        <br /><label>Gender</label><br />
        <input type="radio"  name="rdoGender"  value="Male" />
        <label>Male</label>
        &nbsp;&nbsp;&nbsp;
        <input type="radio"  name="rdoGender"  value="Female" />
        <label>Female</label>

        <br />
        <br /><label>Hobbies</label><br />
        <input type="checkbox"  name="chk1"  value="reading" />
        <label>Book Reading</label>
        &nbsp;&nbsp;&nbsp;
        <input type="checkbox"  name="chk2"  value="garden" />
        <label>Gardening</label>
        &nbsp;&nbsp;&nbsp;
        <input type="checkbox"  name="chk3"  value="chess" />
        <label>Playing Chess</label>

        <br />
        <br /><label>Person Age</label><br />
        <input type="number" name="txtAge" min="20"  max="50" />

        <br />
        <br /><label>Pick Join Date</label><br />
        <input type="date"  name="txtjdate" />

        <br />
        <br /><label>Email</label><br />
        <input type="email" name="txtEmail"  />

        <br />
        <br /><label>Address</label><br />

        <textarea  name="txtAdrs"  rows="5"  cols="50">

        </textarea>

        <br />
        <br /><label>Location</label><br />
        <select  name="ddlLoc">
            <option value="-1">Select Ur City</option>
            <option value="Hyd">Hyderabad</option>
            <option value="Bgl">Bangalore</option>
            <option value="Pune">Pune</option>
        </select>

        <br />
        <br />
        <input type="button"  value="Register" />






    </p>
</body>
</html>
