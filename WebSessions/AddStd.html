    <h1 style="text-align: center;">Adding New Student using FETCH API</h1>
    <hr />
    <form  name="frmAdd"  method="POST" onsubmit="return newStudent()" action="getStdInfo1.html">
    <p style="text-align: center;">
        <label>Std ID</label>
        <br />
        <input type="text"  name="txtId" />
        <br />
        <label>Std Name</label>
        <br />
        <input type="text"  name="txtSname" />
        <br /><br />
        <input type="submit"  value="Add Student" />
    </p>
</form>

<script type="text/javascript">

    function newStudent()
    {
        let sid = frmAdd.txtId.value;
        let sname = frmAdd.txtSname.value;

            const stdData = { id: sid, name: sname};
            //alert(JSON.stringify(stdData));
            fetch('http://localhost:3000/students', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(stdData)
            })
            .then(response => response.json())
            .then(result =>{
                console.log(result);
                //alert(result);
                return true;
            })
            .catch(err =>{
                alert("Error " + err);
                return false;
            });
            return true;
    }
</script>

</body>
</html>
