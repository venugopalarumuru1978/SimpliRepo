<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-secondary" style="margin-top: 100px;">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-1"></div>
            <div class="col-md-10">
                <div class="card">
                    <div class="card-header bg-info">
                        <b>Register Here</b>
                    </div>
                    <div class="card-body bg-success-subtle">
                        <form name="frmReg"  method="post">
                            <div class="row">
                                <div class="col-md-4">
                                    <label>Person Name</label>
                                    <input type="text" name="txtPname"  class="form-control" />
                                </div>
                                <div class="col-md-4">
                                    <label>Father Name</label>
                                    <input type="text" name="txtFname"  class="form-control" />
                                </div>
                                <div class="col-md-4">
                                    <label>Gender</label><br />
                                    <input type="radio"  value="Male"  name="rdoGender" />
                                    <label>Male</label>
                                    &nbsp;&nbsp;&nbsp;&nbsp;
                                    <input type="radio"  value="Female"  name="rdoGender" />
                                    <label>Female</label>
                                </div>
                                
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <label>Hobbies</label><br />

                                    <input type="checkbox"  name="chk1"  value="reading" />
                                    <label>Book Reading</label>
                                    <br />
                                    <input type="checkbox"  name="chk2"  value="garden" />
                                    <label>Gardening</label>
                                    <br />
                                    <input type="checkbox"  name="chk3"  value="chess" />
                                    <label>Playing Chess</label>
                                </div>
                                <div class="col-md-8">
                                    <label>Address</label>
                                    <textarea  name="txtAdrs"  rows="3"  cols="50" class="form-control">

                                    </textarea>                            
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-4">
                                    <label>Location</label>
                                    <select  name="ddlLoc" class="form-select">
                                        <option value="-1">Select Ur City</option>
                                        <option value="Hyd">Hyderabad</option>
                                        <option value="Bgl">Bangalore</option>
                                        <option value="Pune">Pune</option>
                                    </select>
                            
                                </div>
                                <div class="col-md-4">
                                    <label>Email</label>
                                    <input type="email"  name="txtEmail"  class="form-control" />
                                </div>

                                <div class="col-md-4">
                                    <label>Phone Number</label>
                                    <input type="tel"  name="txtPh"  class="form-control" />
                                </div>
                            </div>
                            <br />
                            <div class="row">
                                <div class="col-md-12" style="text-align: center;">
                                    <input type="submit"  value="Register"  class="btn btn-primary" />
                                </div>
                            </div>
                        </form>        
                    </div>
                </div>
            </div>
            <div class="col-md-1"></div>
        </div>
    </div>
</body>
</html>
