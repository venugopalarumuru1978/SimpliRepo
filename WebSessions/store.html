<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
<form name="frmReg" method="post" onsubmit="return AddStudent()" action="getinfo.html">
    <table  width="100%" border="1" id="getstd">
        <tr>
            <th>ID: <input type="text"  name="txtID" /></th>
            </tr>
            <tr>
            <th>Student Name: 
                <input type="text" name="txtsname" />
            </th>
        </tr>
        <tr>
            <td colspan="2">
                <input type="submit"  value="Click Me" />
            </td>
        </tr>

    </table>
</form>

    <script type="text/javascript">

        function AddStudent()        
        {
            let sid = frmReg.txtID.value;
            let sname = frmReg.txtsname.value;
            const xhr = new XMLHttpRequest();

        xhr.open('POST', 'http://localhost:3000/students', true); // Initialize request
        xhr.setRequestHeader('Content-Type', 'application/json'); // Set headers

// Define callback for state changes
        xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) { // Request finished
        if (xhr.status === 200 || xhr.status === 201) {
            alert('Success:', JSON.parse(xhr.responseText));
            return true;
        } else {
            console.error('Error string:', xhr.statusText);
            return false;
        }
    }
};
        const dataToSend = JSON.stringify({ id: sid, name : sname });
        xhr.send(dataToSend); 
        }

    </script>    
</body>
</html>
