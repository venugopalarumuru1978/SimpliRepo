<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>

<body  onload="loadStudentsInfo()">
    <h2 style="text-align: center;">
        <a href="AddStd.html">New Student</a>
        &nbsp;&nbsp;&nbsp;
        <a href="getStdInfo1.html">All Students</a>
        &nbsp;&nbsp;&nbsp;
        <a href="Search.html">Search Student</a>
    </h2>
    <hr />

    <h1 style="text-align: center;">Fetching Student Info using FETCH API</h1>
    <hr />
    <table width="100%" border="1"  id="getstd">
    </table>

    <script type="text/javascript">

        function loadStudentsInfo()
        {   // by default fetch() method passes GET request
            fetch('http://localhost:3000/students')
                .then(response => response.json())   
                .then(data => 
                {
                    //console.log(data);
                    displayJSON(data);
                })
                .catch(error => {
                    alert('Error:' + error)
                });
        }

        function displayJSON(jsonStdInfo)
        {
            console.log(jsonStdInfo);

            let rows = "<tr><th>Std ID</th><th>Std Name</th><th>Operations</th></tr>";

            for(let i=0;i<jsonStdInfo.length;i++)
            {
                let row = "<tr>";
                row = row + "<td>" + jsonStdInfo[i].id + "</td>";
                row = row + "<td>" + jsonStdInfo[i].name + "</td>";
                row = row + "<td><input type='button' value='Delete' onclick='delStudent("+  jsonStdInfo[i].id +  ")'/></td>";
                row = row + "</tr>";
                rows = rows + row;
            }
            //alert(rows);
            document.getElementById("getstd").innerHTML = rows;
        }

        function delStudent(sid)
        {
            console.log(String(sid));
            fetch('http://localhost:3000/students/' + String(sid), {
            method: 'DELETE'
            })
            .then(response => response.json())
            .then(result =>{
                //alert('Deleted:', result);
                loadStudentsInfo();
            } );
        }
    </script>
</body>
</html>
