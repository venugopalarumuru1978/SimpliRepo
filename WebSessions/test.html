<ul>
  <li>Item A</li>
  <li>Item B</li>
  <li>Item C</li>
</ul>

<script>
  let listItems = document.getElementsByTagName('li');

  // Loop through each <li> and apply a background color
  for (let i = 0; i < listItems.length; i++) {
    listItems[i].style.backgroundColor = 'yellow';
  }
</script>
