<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body onload="getdata()">

    <table  width="100%" border="1" id="getstd">
        <tr>
            <th>ID</th>
            <th>name</th>
        </tr>
    </table>
    
    <script type="text/javascript">

        function getdata()
        {
            let xhr = new XMLHttpRequest();
        xhr.open('GET', 'http://localhost:3000/students', true);
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4 && xhr.status === 200) {
                let jsonObject = JSON.parse(xhr.responseText);
                displayJSON(jsonObject);            
            }
        };
        xhr.send();
        }

        function displayJSON(jsonObject) {
            console.log(jsonObject);

            let rows = "";
            for(let i=0;i<jsonObject.length;i++)
            {
                let row = "<tr>";
                row = row + "<td>" + jsonObject[i].id + "</td>";
                row = row + "<td>" + jsonObject[i].name + "</td>";
                row = row + "</tr>";
                rows = rows + row;
            }
            document.getElementById("getstd").innerHTML += rows;                
        }
    </script>    
</body>
</html>
