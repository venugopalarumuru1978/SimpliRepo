<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <h1 style="text-align: center;">Java Script</h1>    
    <hr />

    <form name="frmRadio">
        <p style="text-align: center;">
        <input type="radio"  name="rdoImg"  value="slide-1.jpg"  onchange="TestRadio()"/>
        <label>Image - 1</label>

        &nbsp;&nbsp;&nbsp;
        <input type="radio"  name="rdoImg"  value="slide-2.jpg" onchange="TestRadio()"/>
        <label>Image - 2</label>
    </p>
    </form>    
    <p id="result"></p>

    <script type="text/javascript">

        function  TestRadio()
        {
            let  imginfo = "<img src='Pics/" + frmRadio.rdoImg.value + "' width='100%'  height='300px' />"

            document.getElementById("result").innerHTML = imginfo;
        }


    </script>
</body>
</html>
