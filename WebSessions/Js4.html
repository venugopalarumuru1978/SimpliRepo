<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
</head>
<body>
    <h1 style="text-align: center;">Java Script</h1>    
    <hr />
    <form  name="frmTest">
        <p style="text-align: center;">
            <label>Person Name : </label>
            <input type="text"  name="txtPname" />
            <input type="button"  value="Click Me" onclick="TestInput()" />
        </p>
    </form>
    <h2 id="resinfo" style="text-align: center;"></h2>
    <script type="text/javascript">

        function  TestInput()
        {
            let pname =  frmTest.txtPname.value;
            if(pname!="")
            {
                //document.getElementById("resinfo").innerText = "<u>Hello, " + pname + "</u>";
                document.getElementById("resinfo").innerHTML = "<u>Hello, " + pname + "</u>";
            }
            else
                alert("Please enter ur name");
        }
    </script>
</body>
</html>
